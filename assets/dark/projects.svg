<svg viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projects by Uditha Vithanage: thyra, uploady, react-searchx, auto-license">
  <style>
    :root { --ink:#000000; --paper:#FFFFFF; }
    @media (prefers-color-scheme:dark) { :root { --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; } }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:var(--ink); stroke-width:1; }
    .title { fill:var(--ink); font-size:17px; font-weight:700; letter-spacing:.8px; }
    .copy { fill:var(--ink); font-size:12px; }
    .meta { fill:var(--ink); font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.10s}.r3{animation-delay:.15s}.r4{animation-delay:.20s}.r5{animation-delay:.25s}
    .r6{animation-delay:.30s}.r7{animation-delay:.35s}.r8{animation-delay:.40s}.r9{animation-delay:.45s}.r10{animation-delay:.50s}
    .r11{animation-delay:.55s}.r12{animation-delay:.60s}.r13{animation-delay:.65s}.r14{animation-delay:.70s}.r15{animation-delay:.75s}
    @media (prefers-reduced-motion:reduce) { .row { animation:none; opacity:1; } }
  :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --node-bg:#000000; --core-bg:#000000; --ghost:#FFFFFF; --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; }
</style>

  <g class="mono">
    <g class="row r1" transform="translate(0 20)">
      <text class="title" x="48" y="24">01 / THYRA</text>
      <text class="copy" x="48" y="49">A tiny CLI to bookmark project folders under short names and open them instantly in your favorite editor.</text>
      <text class="copy" x="48" y="68">Built for fast navigation, repeatable terminal workflows, and a cleaner developer setup.</text>
      <text class="meta" x="48" y="87">TYPESCRIPT · CLI · PRODUCTIVITY · TOOLING</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r2" transform="translate(0 130)">
      <text class="title" x="48" y="24">02 / UPLOADY</text>
      <text class="copy" x="48" y="49">Advanced Express file server with resumable uploads, thumbnails, secure URLs, and metadata management.</text>
      <text class="copy" x="48" y="68">Focuses on reliable file delivery and a practical server-side upload experience.</text>
      <text class="meta" x="48" y="87">JAVASCRIPT · NODE.JS · EXPRESS · FILE SERVER</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r3" transform="translate(0 240)">
      <text class="title" x="48" y="24">03 / REACT-SEARCHX</text>
      <text class="copy" x="48" y="49">Debounced search library with caching and pagination for React.</text>
      <text class="copy" x="48" y="68">Designed to make search-driven interfaces responsive and easy to compose.</text>
      <text class="meta" x="48" y="87">REACT · TYPESCRIPT · SEARCH · LIBRARY</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r4" transform="translate(0 350)">
      <text class="title" x="48" y="24">04 / AUTO-LICENSE</text>
      <text class="copy" x="48" y="49">Automatically add license headers to new files in a specified folder.</text>
      <text class="copy" x="48" y="68">Simple automation for keeping project files consistent from the start.</text>
      <text class="meta" x="48" y="87">JAVASCRIPT · AUTOMATION · TOOLING</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
  </g>
</svg>
